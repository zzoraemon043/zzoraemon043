<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Oba Yang — game tools, Live2D / Spine utilities and offline-first dev tools">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1f3b"/>
      <stop offset="1" stop-color="#3a2a5c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb3c7"/>
      <stop offset="1" stop-color="#b9a7ff"/>
    </linearGradient>
    <style>
      .t { font-family: 'Segoe UI', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
      .float { animation: float 4s ease-in-out infinite; }
      .tw { animation: tw 3s ease-in-out infinite; }
      .tw2 { animation: tw 3s ease-in-out 1.5s infinite; }
      @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
      @keyframes tw { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
    </style>
  </defs>
  <rect width="900" height="220" rx="18" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#fff">
    <circle class="tw" cx="80" cy="40" r="1.6"/>
    <circle class="tw2" cx="160" cy="180" r="1.3"/>
    <circle class="tw" cx="520" cy="30" r="1.4"/>
    <circle class="tw2" cx="610" cy="190" r="1.6"/>
    <circle class="tw" cx="850" cy="60" r="1.3"/>
    <circle class="tw2" cx="400" cy="200" r="1.2"/>
  </g>

  <!-- sheep -->
  <g transform="translate(700 70)">
  <g class="float">
    <g fill="#f4f1ff">
      <circle cx="40" cy="40" r="26"/>
      <circle cx="68" cy="36" r="24"/>
      <circle cx="94" cy="44" r="22"/>
      <circle cx="54" cy="62" r="24"/>
      <circle cx="84" cy="64" r="22"/>
    </g>
    <ellipse cx="22" cy="54" rx="17" ry="20" fill="#3b3456"/>
    <ellipse cx="9" cy="44" rx="8" ry="4" fill="#3b3456" transform="rotate(-25 9 44)"/>
    <circle cx="17" cy="51" r="3" fill="#fff"/>
    <circle cx="28" cy="51" r="3" fill="#fff"/>
    <circle cx="17" cy="51" r="1.4" fill="#1b1f3b"/>
    <circle cx="28" cy="51" r="1.4" fill="#1b1f3b"/>
    <ellipse cx="15" cy="60" rx="3" ry="1.8" fill="#ffb3c7"/>
    <ellipse cx="31" cy="60" rx="3" ry="1.8" fill="#ffb3c7"/>
    <g fill="#3b3456">
      <rect x="44" y="80" width="7" height="18" rx="3"/>
      <rect x="62" y="82" width="7" height="16" rx="3"/>
      <rect x="80" y="82" width="7" height="16" rx="3"/>
      <rect x="96" y="78" width="7" height="18" rx="3"/>
    </g>
  </g>
  </g>

  <text class="t" x="56" y="92" font-size="44" font-weight="700" fill="#ffffff">Hi, I'm Oba Yang</text>
  <text class="t" x="56" y="128" font-size="20" fill="url(#accent)" font-weight="600">歐巴羊 · Software Tools · Live2D / Spine · Offline-first Dev Tools</text>
  <text class="t" x="56" y="166" font-size="16" fill="#c9c4e8">Building tools that run on your machine — no upload, no account.</text>
</svg>
